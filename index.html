<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lotto Number Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle Dark/Light Mode">🌙</button>
        <h1>Lotto Number Generator</h1>
        <button id="generate-btn">Generate Numbers</button>
        <div id="numbers-container" class="numbers-container"></div>
        
        <div class="fortune-section">
            <button id="fortune-btn">Check Today's Fortune</button>
            <p id="fortune-display" class="fortune-display"></p>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
